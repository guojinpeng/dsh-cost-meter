<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>费用统计 · 样式样例 / Cost statistics sample</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
:root[data-theme="light"] {
  --bg-base: #ffffff;
  --bg-sidebar: #f9fafb;
  --bg-layer1: #ffffff;
  --bg-layer2: #f1f3f5;
  --bg-layer3: #ebeef2;
  --border-l1: rgba(0, 0, 0, 0.06);
  --border-l2: rgba(0, 0, 0, 0.12);
  --text-1: #0f1115;
  --text-2: #61666b;
  --text-3: #81858c;
  --text-4: #adb2b8;
  --hover: rgba(38, 49, 72, 0.06);
  --s1: #0f1115;
  --s2: #61666b;
  --s3: #adb2b8;
  --s4: #ebeef2;
  --s4line: #adb2b8;
  --shadow: 0 1px 2px rgba(15, 17, 21, 0.06);
}
:root[data-theme="dark"] {
  --bg-base: #151517;
  --bg-sidebar: #1b1b1c;
  --bg-layer1: #232324;
  --bg-layer2: #2c2c2e;
  --bg-layer3: #353638;
  --border-l1: rgba(255, 255, 255, 0.07);
  --border-l2: rgba(255, 255, 255, 0.13);
  --text-1: #f9fafb;
  --text-2: #cfd3d6;
  --text-3: #adb2b8;
  --text-4: #81858c;
  --hover: rgba(255, 255, 255, 0.08);
  --s1: #f9fafb;
  --s2: #cfd3d6;
  --s3: #81858c;
  --s4: #353638;
  --s4line: #81858c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-1);
  background: var(--bg-base);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
button:focus-visible { outline: 2px solid var(--text-3); outline-offset: 2px; }
.app { display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 264px;
  flex: 0 0 264px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px 10px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-l1);
}
.brand { display: flex; align-items: center; gap: 8px; padding: 8px 10px 18px; }
.brand svg { display: block; }
.wordmark { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.badge {
  border: 1px solid var(--border-l2);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--text-2);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.08em;
}
.newchat {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 36px;
  margin-bottom: 14px;
  border: 1px solid var(--border-l1);
  border-radius: 10px;
  background: var(--bg-layer3);
  color: var(--text-1);
  font-size: 13px;
  cursor: pointer;
}
.newchat:hover { background: var(--hover); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 34px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text-2);
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}
.nav-item:hover { background: var(--hover); color: var(--text-1); }
.nav-item.active { background: var(--bg-layer2); color: var(--text-1); font-weight: 500; }
.nav-item svg { flex: 0 0 16px; opacity: 0.85; }
.spacer { flex: 1; }
.side-foot { padding: 8px 10px; color: var(--text-4); font-size: 11px; }

/* Main */
.main { flex: 1; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  padding: 28px 32px 20px;
}
h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.subtitle { margin: 0; color: var(--text-3); font-size: 13px; }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.segmented, .toggle {
  display: flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--border-l1);
  border-radius: 10px;
  background: var(--bg-layer2);
}
.segmented button, .toggle button {
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text-2);
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.toggle button { padding: 4px 9px; font-size: 11px; }
.segmented button:hover, .toggle button:hover { color: var(--text-1); }
.segmented button.active, .toggle button.active {
  background: var(--bg-layer1);
  color: var(--text-1);
  box-shadow: var(--shadow);
}
.icon-btn, .lang-btn {
  height: 30px;
  min-width: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 8px;
  border: 1px solid var(--border-l1);
  border-radius: 8px;
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
  cursor: pointer;
}
.icon-btn:hover, .lang-btn:hover { background: var(--hover); color: var(--text-1); }

.content {
  width: 100%;
  max-width: 1240px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 0 32px 8px;
}
.grid { display: grid; gap: 16px; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.two { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.grid.split { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.card {
  min-width: 0;
  padding: 18px 20px;
  border: 1px solid var(--border-l1);
  border-radius: 16px;
  background: var(--bg-layer1);
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.card h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.hint { color: var(--text-4); font-size: 11px; }

.kpi-label { color: var(--text-3); font-size: 12px; }
.kpi-value {
  margin: 8px 0 6px;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.kpi-sub { color: var(--text-4); font-size: 11px; }
.kpi-bar {
  height: 3px;
  margin: 10px 0 6px;
  border-radius: 2px;
  background: var(--border-l1);
  overflow: hidden;
}
.kpi-bar span { display: block; height: 100%; border-radius: 2px; background: var(--s2); }

.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--text-3); font-size: 11px; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
.sw.s1 { background: var(--s1); }
.sw.s2 { background: var(--s2); }
.sw.s3 { background: var(--s3); }
.sw.s4 { background: repeating-linear-gradient(45deg, var(--s4) 0 2px, var(--s4line) 2px 3px); }
.tooltip {
  position: absolute;
  z-index: 5;
  padding: 8px 10px;
  border: 1px solid var(--border-l2);
  border-radius: 10px;
  background: var(--bg-layer3);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  color: var(--text-2);
  font-size: 11px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -100%);
  transition: opacity 0.12s ease;
}
.tooltip.on { opacity: 1; }
.tt-title { margin-bottom: 4px; color: var(--text-1); font-weight: 600; }
.tt-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.tt-row .v { margin-left: auto; padding-left: 14px; color: var(--text-1); font-variant-numeric: tabular-nums; }

.donut-wrap { position: relative; display: flex; justify-content: center; margin: 2px 0 12px; }
.donut-wrap svg { width: 150px; height: 150px; }
.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.donut-center .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.donut-center .k { margin-top: 2px; color: var(--text-4); font-size: 10px; }
.legend-rows { display: flex; flex-direction: column; gap: 8px; }
.legend-row { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 12px; }
.legend-row .val { margin-left: auto; color: var(--text-4); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
.legend-row .pct { min-width: 44px; color: var(--text-1); text-align: right; font-variant-numeric: tabular-nums; }
.saved {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-l1);
  color: var(--text-2);
  font-size: 12px;
}
.saved b { color: var(--text-1); font-weight: 600; font-variant-numeric: tabular-nums; }

.table { width: 100%; border-collapse: collapse; font-size: 12px; }
.table th {
  padding: 0 8px 8px;
  color: var(--text-4);
  font-weight: 500;
  text-align: right;
  white-space: nowrap;
}
.table th:first-child { padding-left: 0; text-align: left; }
.table td {
  padding: 9px 8px;
  border-top: 1px solid var(--border-l1);
  color: var(--text-2);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.table td:first-child { padding-left: 0; color: var(--text-1); text-align: left; }
.model-name { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.model-dot { width: 6px; height: 6px; border-radius: 2px; background: var(--s2); }
.share { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.share .bar { width: 60px; height: 4px; border-radius: 2px; background: var(--border-l1); overflow: hidden; }
.share .bar span { display: block; height: 100%; border-radius: 2px; background: var(--s2); }

.hours { display: flex; flex-direction: column; gap: 9px; }
.hour-row { display: grid; grid-template-columns: 96px 1fr 68px; align-items: center; gap: 10px; font-size: 12px; }
.hour-row .lbl { overflow: hidden; color: var(--text-3); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.hour-row .bar { height: 6px; border-radius: 3px; background: var(--border-l1); overflow: hidden; }
.hour-row .bar span { display: block; height: 100%; border-radius: 3px; background: var(--s2); }
.hour-row .val { color: var(--text-1); text-align: right; font-variant-numeric: tabular-nums; }
.hour-foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border-l1);
  color: var(--text-4);
  font-size: 11px;
}

.sessions { display: flex; flex-direction: column; }
.session-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border-l1); }
.session-row:first-child { padding-top: 0; border-top: 0; }
.session-main { flex: 1; min-width: 0; }
.session-title { overflow: hidden; color: var(--text-1); font-size: 12.5px; text-overflow: ellipsis; white-space: nowrap; }
.session-meta { margin-top: 3px; color: var(--text-4); font-size: 11px; }
.session-cost { color: var(--text-1); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.note-body { display: flex; flex-direction: column; gap: 8px; margin: 0; color: var(--text-3); font-size: 12px; line-height: 1.65; }
.note-body b { color: var(--text-1); font-weight: 500; }
.page-foot { max-width: 1240px; padding: 16px 32px 28px; color: var(--text-4); font-size: 11px; }

@media (max-width: 1180px) {
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.two, .grid.split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .sidebar { display: none; }
  .page-head { flex-direction: column; padding: 20px 18px 14px; }
  .content { padding: 0 18px 8px; }
  .page-foot { padding: 16px 18px 24px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15c2.5 3 6.5 4 10 2.5 2.2-1 4-3 4-6.5-2.2 1.6-4.5 2.3-6.4 2.3-2.6 0-4.4-1.6-4.4-4.4C5.9 10 5 12.4 5 14.6c0 .2 0 .3-.1.4z" fill="currentColor"/></svg>
      <span class="wordmark">deepseek</span>
      <span class="badge">HARNESS</span>
    </div>
    <button class="newchat" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span data-i18n="nav.newChat">新会话</span>
    </button>
    <nav class="nav" aria-label="sidebar">
      <button class="nav-item" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
        <span data-i18n="nav.plugins">插件</span>
      </button>
      <button class="nav-item" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4.5 8h15l-1.2 11.5H5.7L4.5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
        <span data-i18n="nav.market">插件市场</span>
      </button>
      <button class="nav-item" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
        <span data-i18n="nav.automation">自动化任务</span>
      </button>
      <button class="nav-item" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3 3.5 8 12 13l8.5-5L12 3z"/><path d="m3.5 13 8.5 5 8.5-5"/></svg>
        <span data-i18n="nav.insight">上下文洞察</span>
      </button>
      <button class="nav-item active" type="button" aria-current="page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="nav.cost">费用统计</span>
      </button>
    </nav>
    <div class="spacer"></div>
    <div class="side-foot">dsh-cost-meter · 0.4.0 preview</div>
  </aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1 data-i18n="page.title">费用统计</h1>
        <p class="subtitle" data-i18n="page.subtitle">全部会话的 token 花费总览</p>
      </div>
      <div class="controls">
        <div class="segmented" role="group" aria-label="range">
          <button type="button" data-range="7" data-i18n="range.7">近 7 天</button>
          <button type="button" data-range="30" class="active" data-i18n="range.30">近 30 天</button>
          <button type="button" data-range="90" data-i18n="range.90">近 90 天</button>
          <button type="button" data-range="365" data-i18n="range.all">全部</button>
        </div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="theme"></button>
        <button class="lang-btn" id="langBtn" type="button" aria-label="language">EN</button>
      </div>
    </header>

    <div class="content">
      <section class="kpi-grid" id="kpis" aria-label="summary"></section>

      <div class="grid two">
        <section class="card">
          <div class="card-head">
            <div>
              <h2 data-i18n="trend.title">花费趋势</h2>
            </div>
            <div class="toggle" role="group">
              <button type="button" data-metric="cost" class="active" data-i18n="trend.byCost">金额</button>
              <button type="button" data-metric="tokens" data-i18n="trend.byTokens">Token</button>
            </div>
          </div>
          <div class="legend" id="trendLegend"></div>
          <div class="chart-wrap" id="trendWrap">
            <svg id="trendSvg" role="img" aria-label="spend trend"></svg>
            <div class="tooltip" id="tooltip"></div>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 data-i18n="composition.title">Token 构成</h2>
            <span class="hint" data-i18n="composition.hint">按计费类别</span>
          </div>
          <div class="donut-wrap">
            <svg id="donut" viewBox="0 0 120 120" role="img" aria-label="token composition"></svg>
            <div class="donut-center">
              <span class="v" id="donutValue">—</span>
              <span class="k" data-i18n="composition.center">总 Token</span>
            </div>
          </div>
          <div class="legend-rows" id="compositionLegend"></div>
          <div class="saved">
            <span data-i18n="composition.saved">缓存节省</span>
            <b id="cacheSaved">—</b>
          </div>
        </section>
      </div>

      <div class="grid split">
        <section class="card">
          <div class="card-head">
            <h2 data-i18n="models.title">模型花费排行</h2>
            <span class="hint" data-i18n="models.hint">按花费排序</span>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th data-i18n="col.model">模型</th>
                <th data-i18n="col.share">花费占比</th>
                <th data-i18n="col.cost">花费</th>
                <th data-i18n="col.tokens">Token</th>
                <th data-i18n="col.turns">轮次</th>
                <th data-i18n="col.hit">缓存命中</th>
              </tr>
            </thead>
            <tbody id="modelRows"></tbody>
          </table>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 data-i18n="hours.title">时段分布</h2>
            <span class="hint" data-i18n="hours.sub">北京时间</span>
          </div>
          <div class="hours" id="hourRows"></div>
          <div class="hour-foot">
            <span id="hourPeak">—</span>
            <span id="hourSaved">—</span>
          </div>
        </section>
      </div>

      <div class="grid two">
        <section class="card">
          <div class="card-head">
            <h2 data-i18n="sessions.title">高花费会话</h2>
            <span class="hint" data-i18n="sessions.hint">最近 6 个会话</span>
          </div>
          <div class="sessions" id="sessionRows"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 data-i18n="note.title">口径说明</h2>
          </div>
          <p class="note-body" id="noteBody"></p>
        </section>
      </div>
    </div>
    <footer class="page-foot" data-i18n="footer">示例数据 · 仅用于样式评审</footer>
  </main>
</div>

<script>
(function () {
  "use strict";

  var DAY = 86400000;
  var RATE = 7.2;
  var P = { input: 2, output: 8, cacheRead: 0.2, cacheWrite: 2 };
  var MONTHS_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  var I18N = {
    zh: {
      "nav.newChat": "新会话",
      "nav.plugins": "插件",
      "nav.market": "插件市场",
      "nav.automation": "自动化任务",
      "nav.insight": "上下文洞察",
      "nav.cost": "费用统计",
      "page.title": "费用统计",
      "page.subtitle": "全部会话的 token 花费总览",
      "range.7": "近 7 天",
      "range.30": "近 30 天",
      "range.90": "近 90 天",
      "range.all": "全部",
      "kpi.totalSpend": "总花费",
      "kpi.vsPrev": "较上一周期",
      "kpi.totalTokens": "总 Token",
      "kpi.tokensSub": "输入 {a} · 输出 {b}",
      "kpi.cacheHit": "缓存命中率",
      "kpi.cacheSave": "缓存节省 {v}",
      "kpi.turns": "已计价轮次",

    if (params) {
      Object.keys(params).forEach(function (k) {
        text = text.split("{" + k + "}").join(String(params[k]));
      });

    return text;
  }
  function rand(i) {
    var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453;

  }

  function buildSeries() {
    var out = [];
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    for (var k = 0; k < 365; k++) {
      var d = new Date(today.getTime() - (364 - k) * DAY);
      var wd = d.getDay();
      var weekend = wd === 0 || wd === 6 ? 0.35 : 1;
      var wave = 0.7 + 0.5 * Math.sin(k / 9.3) + 0.18 * Math.sin(k / 2.7);
      var input = Math.round(700000 + 520000 * wave * weekend + 180000 * rand(k + 1));
      var output = Math.round(28000 + 22000 * rand(k + 7) + 12000 * wave);
      var cacheRead = Math.round(input * (2.1 + 0.7 * rand(k + 3)));
      var cacheWrite = Math.round(input * (0.1 + 0.1 * rand(k + 11)));
      var turns = Math.max(3, Math.round(6 + 10 * rand(k + 2)));
      out.push({ date: d, input: input, output: output, cacheRead: cacheRead, cacheWrite: cacheWrite, turns: turns });
    }
    return out;
  }

  function costOf(o) {
    return (o.input * P.input + o.output * P.output + o.cacheRead * P.cacheRead + o.cacheWrite * P.cacheWrite) / 1e6;
  }
  function fold(list) {
    var acc = { input: 0, output: 0, cacheRead: 0, cacheWrite: 0, turns: 0, cost: 0 };
    list.forEach(function (d) {
      acc.input += d.input;
      acc.output += d.output;
      acc.cacheRead += d.cacheRead;
      acc.cacheWrite += d.cacheWrite;
      acc.turns += d.turns;
      acc.cost += costOf(d);
    });
    return acc;
  }
  function dateLabel(d) {
    if (state.lang === "zh") return (d.getMonth() + 1) + "/" + d.getDate();
    return MONTHS_EN[d.getMonth()] + " " + d.getDate();
  }
  function monthLabel(d) {
    return state.lang === "zh" ? d.getFullYear() + "/" + (d.getMonth() + 1) : MONTHS_EN[d.getMonth()] + " " + String(d.getFullYear()).slice(2);
  }
  function addBucket(target, d) {
    target.input += d.input;
    target.output += d.output;
    target.cacheRead += d.cacheRead;
    target.cacheWrite += d.cacheWrite;
    target.turns += d.turns;
  }

  function bucketize(list, days) {
    var buckets = [];
    var i;
    if (days <= 31) {
      for (i = 0; i < list.length; i++) {
        var one = { label: dateLabel(list[i].date), input: 0, output: 0, cacheRead: 0, cacheWrite: 0, turns: 0 };
        addBucket(one, list[i]);
        buckets.push(one);
      }
      return buckets;
    }
    if (days <= 120) {
      for (i = 0; i < list.length; i += 7) {
        var chunk = list.slice(i, i + 7);
        var b = { label: dateLabel(chunk[0].date) + "–" + dateLabel(chunk[chunk.length - 1].date), input: 0, output: 0, cacheRead: 0, cacheWrite: 0, turns: 0 };
        chunk.forEach(function (d) { addBucket(b, d); });
        buckets.push(b);
      }
      return buckets;
    }
    var map = Object.create(null);
    list.forEach(function (d) {
      var key = d.date.getFullYear() + "-" + d.date.getMonth();
      if (!map[key]) {
        map[key] = { label: monthLabel(d.date), input: 0, output: 0, cacheRead: 0, cacheWrite: 0, turns: 0 };
        buckets.push(map[key]);
      }
      addBucket(map[key], d);
    });
    return buckets;
  }

  function compute() {
    var part = series.slice(-state.days);
    var prevStart = Math.max(0, series.length - state.days * 2);
    var prev = state.days < series.length ? series.slice(prevStart, series.length - state.days) : [];
    state.agg = { buckets: bucketize(part, state.days), totals: fold(part), prevTotals: fold(prev) };
    agg = state.agg;
  }

  function niceMax(v) {

    return nice * base;
  }
  function fmtMoney(cny) {

  }

  function fmtTokens(n) {

  function renderKpis() {
    var tt = agg.totals;

      statCard(t("kpi.cacheHit"), fmtPct(cachePct), t("kpi.cacheSave", { v: fmtMoney(save) }), bar),

  var TREND_W = 760;

  function renderTrend() {
    var tip = $("#tooltip");
    if (tip) { tip.classList.remove("on"); tip.innerHTML = ""; }
    var data = agg.buckets;
    var values = data.map(function (b) {
      var v = {};
      var sum = 0;
      SEQ.forEach(function (key) {
        v[key] = trendValue(b, key);
        sum += v[key];
      });
      v.sum = sum;
      return v;
    });
    var maxSum = 0;
    values.forEach(function (v) { if (v.sum > maxSum) maxSum = v.sum; });
    var axisMax = niceMax(maxSum);

    var innerH = TREND_H - PAD.t - PAD.b;

    var g;

    }

      var x = PAD.l + i * colW + (colW - barW) / 2;
      var y = PAD.t + innerH;

        var h = (values[i][key] / axisMax) * innerH;
        if (h <= 0) return;

  function attachTrendEvents(values) {

    var offCost = 0;
    var rows = HOURS.map(function (h) {
      var cost = tt.cost * h.weight;
      if (h.offPeak) offCost += cost;
      return '<div class="hour-row"><span class="lbl">' + t(h.key) + '</span><span class="bar"><span style="width:' +
        ((h.weight / maxWeight) * 100).toFixed(1) + '%"></span></span><span class="val">' + fmtMoney(cost) + '</span></div>';
    });
    $("#hourRows").innerHTML = rows.join("");
    var peak = tt.cost - offCost;
    $("#hourPeak").textContent = t("hours.peak", { v: fmtMoney(peak) });
    $("#hourSaved").textContent = t("hours.saved", { v: fmtMoney(offCost * 0.5) });
  }

  var SESSIONS = [
    { zh: "重构会话费用 projection 的按日聚合", en: "Rework daily aggregation in the session cost projection", cost: 0.17, tokens: 0.15, minutes: 2 },
    { zh: "修复中文 locale 回退与按钮间距", en: "Fix Chinese locale fallback and button spacing", cost: 0.13, tokens: 0.11, minutes: 38 },
    { zh: "为价格表增加峰谷规则预览", en: "Add peak and off-peak preview to the price table", cost: 0.1, tokens: 0.09, minutes: 95 },
    { zh: "排查流式响应中的 token 统计偏差", en: "Trace token counting drift in streamed responses", cost: 0.08, tokens: 0.07, minutes: 240 },
    { zh: "补齐模型单价自动同步失败提示", en: "Improve error copy for price sync failures", cost: 0.06, tokens: 0.05, minutes: 1440 },
    { zh: "设计费用统计总览页信息结构", en: "Design the cost overview information architecture", cost: 0.04, tokens: 0.03, minutes: 2880 }
  ];

  function relativeTime(minutes) {
    if (minutes < 60) return t("time.min", { n: minutes });
    if (minutes < 1440) return t("time.hour", { n: Math.round(minutes / 60) });
    return t("time.day", { n: Math.round(minutes / 1440) });
  }

  function renderSessions() {
    var tt = agg.totals;
    var totalTokens = tt.input + tt.output + tt.cacheRead + tt.cacheWrite;
    var rows = SESSIONS.map(function (s) {
      return '<div class="session-row"><div class="session-main"><div class="session-title">' + (state.lang === "zh" ? s.zh : s.en) + '</div>' +
        '<div class="session-meta">' + fmtTokens(totalTokens * s.tokens) + ' · ' + relativeTime(s.minutes) + '</div></div>' +
        '<div class="session-cost">' + fmtMoney(tt.cost * s.cost) + '</div></div>';
    });
    $("#sessionRows").innerHTML = rows.join("");
  }

  function renderNote() {
    var cur = state.lang === "zh" ? "CNY (¥)" : "USD ($)";
    var lines = [
      t("note.body1"),
      t("note.body2"),
      t("note.body3", { cur: cur }),
      t("note.body4")
    ];
    $("#noteBody").innerHTML = lines.map(function (line) { return "<span>" + line + "</span>"; }).join("");
  }

  function renderAll() {
    compute();
    renderStatic();
    renderKpis();
    renderTrend();
    renderComposition();
    renderModels();
    renderHours();
    renderSessions();
    renderNote();
  }

  $("#themeBtn").addEventListener("click", function () {
    state.theme = state.theme === "dark" ? "light" : "dark";
    renderStatic();
  });
  $("#langBtn").addEventListener("click", function () {
    state.lang = state.lang === "zh" ? "en" : "zh";
    renderAll();
  });
  document.addEventListener("click", function (event) {
    var rangeBtn = event.target.closest ? event.target.closest("[data-range]") : null;
    if (rangeBtn) {
      state.days = Number(rangeBtn.getAttribute("data-range"));
      renderAll();
      return;
    }
    var metricBtn = event.target.closest ? event.target.closest("[data-metric]") : null;
    if (metricBtn) {
      state.metric = metricBtn.getAttribute("data-metric");
      renderAll();
    }
  });

  renderAll();
})();
</script>
</body>
</html>
